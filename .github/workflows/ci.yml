name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/http2 is a vendored fork of golang.org/x/net/http2 and is kept
      # byte-comparable with upstream, so it is excluded from formatting checks
      # (see internal/http2/FORK.md).
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/http2/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race -timeout 15m ./...
