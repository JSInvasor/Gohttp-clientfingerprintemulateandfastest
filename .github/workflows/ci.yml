name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/cdp and internal/solver drive a real Chromium. Their tests skip
      # when none is installed, which would quietly turn the half of the solver
      # that needs a browser into untested code — so CI installs one. Everything
      # else in the tree needs nothing.
      - name: install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser xvfb \
            || sudo apt-get install -y --no-install-recommends chromium xvfb
          command -v chromium-browser || command -v chromium

      # internal/http2 and internal/quicgo are vendored forks kept byte-comparable
      # with upstream, so they are excluded from formatting checks: reformatting
      # them would destroy the property their FORK.md files are built on, which
      # is that a diff against the upstream tree shows only the deltas this
      # repository intends. Five of quic-go's own files are not gofmt-clean
      # upstream, and that is upstream's business.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -vE '^internal/(http2|quicgo)/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race -timeout 15m ./...
